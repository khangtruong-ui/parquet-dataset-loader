[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-dataset-loader"
version = "0.3.2"
description = "High-performance, memory-efficient loader for large Hugging Face Parquet datasets with instant index-based streaming"
readme = "README.md"
authors = [
    { name = "Khang Truong", email = "khangtruong-ui@users.noreply.github.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
keywords = [
    "parquet",
    "dataset",
    "huggingface",
    "streaming",
    "index-streaming",
    "pyarrow",
    "dataloader",
    "deep-learning",
]
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=14.0.0",
    "requests>=2.28.0",
    "fsspec>=2023.1.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.60.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/khangtruong-ui/parquet-dataset-loader"
Repository = "https://github.com/khangtruong-ui/parquet-dataset-loader"
Issues = "https://github.com/khangtruong-ui/parquet-dataset-loader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests requiring internet or remote HuggingFace access (deselect with '-m \"not integration\"')",
]
